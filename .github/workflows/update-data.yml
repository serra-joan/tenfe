name: Actualitzar dades GTFS

on:
  schedule:
    - cron: '0 */6 * * *'  # Cada 6 hores
  workflow_dispatch:        # Permet execució manual des de GitHub

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4

      - name: Instal·lar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Instal·lar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Instal·lar dependències
        run: pnpm install --frozen-lockfile

      - name: Descarregar ZIP de Renfe
        run: |
          curl -fsSL -o /tmp/fomento_transit.zip \
            "https://ssl.renfe.com/ftransit/Fichero_CER_FOMENTO/fomento_transit.zip"

      - name: Descomprimir fitxers raw
        run: |
          unzip -o /tmp/fomento_transit.zip \
            agency.txt calendar.txt routes.txt shapes.txt \
            stop_times.txt stops.txt transfers.txt trips.txt \
            -d public/files/raw/
          rm /tmp/fomento_transit.zip

      - name: Executar scripts d'extracció
        run: node scripts/run_extracts.js

      - name: Eliminar fitxers raw
        run: |
          rm -f public/files/raw/*.txt

      - name: Commit i push dels JSONs actualitzats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/files/output/
          git diff --staged --quiet && echo "Sense canvis, res a commitear." || \
            git commit -m "chore: actualitzar dades GTFS [$(date -u '+%Y-%m-%d %H:%M UTC')]" && git push
